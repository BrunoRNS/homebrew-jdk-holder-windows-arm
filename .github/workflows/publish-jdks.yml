name: Publish Windows ARM64 JDK downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify JDK archives
        shell: bash
        run: |
          set -euo pipefail

          archives=(
            "zulu17.70.113-ca-jdk17.0.21.0.3-win_aarch64.zip"
            "zulu21.54.109-ca-jdk21.0.13.0.3-win_aarch64.zip"
            "zulu25.38.109-ca-jdk25.0.5.0.3-win_aarch64.zip"
            "zulu27.30.109-ca-jdk27.0.1.0.3-win_aarch64.zip"
          )
          downloads="$RUNNER_TEMP/jdk-downloads"
          mkdir -p "$downloads"
          cd "$downloads"

          for archive in "${archives[@]}"; do
            echo "Downloading $archive"
            curl --fail --location --retry 3 --retry-all-errors \
              "https://cdn.azul.com/zulu/bin/$archive" \
              --output "$archive"
            unzip -tq "$archive"
          done

          sha256sum "${archives[@]}" > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="jdk-downloads"
          downloads="$RUNNER_TEMP/jdk-downloads"
          assets=("$downloads"/*.zip "$downloads/SHA256SUMS.txt")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Windows ARM64 Zulu JDK downloads" \
              --notes "Verified Azul Zulu JDK ZIP archives for Windows ARM64. SHA256SUMS.txt contains the SHA-256 checksums."
          fi
